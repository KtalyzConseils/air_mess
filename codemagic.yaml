workflows:
  ios-test:
    name: AIRMESS iOS Test

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Locate Expo project
        script: |
          PACKAGE_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "PACKAGE_DIR=$PACKAGE_DIR"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$CM_ENV"

      - name: Install dependencies
        script: |
          cd "$PACKAGE_DIR"
          npm install

      - name: Check Expo configuration
        script: |
          cd "$PACKAGE_DIR"
          npx expo config --type public

      - name: Generate iOS project
        script: |
          cd "$PACKAGE_DIR"
          npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods
        script: |
          cd "$PACKAGE_DIR/ios"
          pod install --repo-update

      - name: Build iOS simulator application
        script: |
          cd "$PACKAGE_DIR"
          SCHEME=$(xcode-project detect-schemes ios/*.xcworkspace | head -1)
          echo "Detected scheme: $SCHEME"

          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - "**/Build/Products/Debug-iphonesimulator/*.app"
      - /tmp/xcodebuild_logs/*.log