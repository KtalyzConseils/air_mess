workflows:
  # Build SIGNÉ + envoi TestFlight. Utilisé pour tester l'appel VoIP (CallKit) sur un
  # iPhone réel : la signature app_store donne l'environnement APNs PRODUCTION, aligné
  # avec aps-environment=production (config plugin) et APNS_ENV=production (backend).
  # Prérequis : fiche app créée dans App Store Connect pour com.airmess.driver.
  ios-release:
    name: AIRMESS Driver - Signed TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: apps/driver-app

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.airmess.driver
      vars:
        CI: "1"
        # Build de prod : l'app parle à la prod, qui envoie le push VoIP.
        EXPO_PUBLIC_API_BASE_URL: "https://api.airmess-logistics.com/api"

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
          test -d node_modules/expo

      - name: Generate iOS project
        script: |
          set -e
          export CI=1
          export RNFirebaseAsStaticFramework=true
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Bump build number (unique pour TestFlight)
        script: |
          set -e
          cd ios
          # $BUILD_NUMBER = compteur Codemagic monotone → évite le rejet "build already exists".
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/AirMessDriver.xcworkspace \
            --scheme AirMessDriver

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-test:
    name: AIRMESS Driver - Unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    working_directory: apps/driver-app

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        CI: "1"
        EXPO_PUBLIC_API_BASE_URL: "https://dev.api.airmess-logistics.com/api"

    scripts:
      - name: Verify project directory
        script: |
          set -e
          pwd
          ls -la
          test -f package.json
          test -f GoogleService-Info.plist
          grep '"expo"' package.json

      - name: Verify API configuration
        script: |
          set -e

          echo "API URL: $EXPO_PUBLIC_API_BASE_URL"

          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "EXPO_PUBLIC_API_BASE_URL is missing"
            exit 1
          fi

          node -e "
            const url = process.env.EXPO_PUBLIC_API_BASE_URL;

            if (!url || !url.startsWith('https://')) {
              throw new Error('Invalid API URL: ' + url);
            }

            console.log('Valid API URL:', url);
          "

      - name: Test API accessibility
        script: |
          set -e

          echo "Testing API connectivity..."
          curl \
            --fail-with-body \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            "$EXPO_PUBLIC_API_BASE_URL" \
            || echo "The API root returned an error response, but the host may still be reachable."

      - name: Install dependencies
        script: |
          set -e
          npm install
          npm ls expo
          test -d node_modules/expo

      - name: Check Expo configuration
        script: |
          set -e
          npx expo config --type public

      - name: Generate iOS project
        script: |
          set -e
          export CI=1
          export RNFirebaseAsStaticFramework=true
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update

      - name: Verify Xcode workspace
        script: |
          set -e
          test -d ios/AirMessDriver.xcworkspace
          xcodebuild -list \
            -workspace ios/AirMessDriver.xcworkspace

      - name: Build unsigned app for physical iPhone
        script: |
          set -e

          echo "Building with API URL: $EXPO_PUBLIC_API_BASE_URL"

          xcodebuild \
            -workspace ios/AirMessDriver.xcworkspace \
            -scheme AirMessDriver \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify embedded API URL
        script: |
          set -e

          BUNDLE_PATH="build/ios-device/Build/Products/Release-iphoneos/main.jsbundle"

          test -f "$BUNDLE_PATH"

          if grep -q "dev.api.airmess-logistics.com" "$BUNDLE_PATH"; then
            echo "API URL found in the JavaScript bundle."
          else
            echo "API URL was not found in the JavaScript bundle."
            exit 1
          fi

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH=$(find build/ios-device/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "No iPhone .app file found"
            exit 1
          fi

          echo "Application found: $APP_PATH"

          rm -rf build/unsigned-ipa
          mkdir -p build/unsigned-ipa/Payload

          cp -R "$APP_PATH" build/unsigned-ipa/Payload/

          cd build/unsigned-ipa
          zip -qry AirMessDriver-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh AirMessDriver-unsigned.ipa

    artifacts:
      - build/unsigned-ipa/AirMessDriver-unsigned.ipa
      - build/ios-device/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log