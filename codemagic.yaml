workflows:
  ios-test:
    name: AIRMESS Driver iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: apps/driver-app

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        CI: "1"

    scripts:
      - name: Verify project directory
        script: |
          pwd
          ls -la
          test -f package.json
          grep '"expo"' package.json

      - name: Install dependencies
        script: |
          npm install
          npm ls expo
          test -d node_modules/expo

      - name: Check Expo configuration
        script: |
          npx expo config --type public

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS simulator app
        script: |
          SCHEME=$(xcode-project detect-schemes ios/*.xcworkspace | head -1)
          echo "Detected scheme: $SCHEME"

          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - "**/Build/Products/Debug-iphonesimulator/*.app"
      - /tmp/xcodebuild_logs/*.log