
workflows:
  ios-test:
    name: AIRMESS Driver iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: apps/driver-app

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        CI: "1"

    scripts:
      - name: Verify project directory
        script: |
          pwd
          ls -la
          test -f package.json
          grep '"expo"' package.json
          test -f GoogleService-Info.plist

      - name: Install dependencies
        script: |
          npm install
          npm ls expo
          test -d node_modules/expo

      - name: Check Expo configuration
        script: |
          npx expo config --type public

      - name: Generate iOS project
        script: |
          export CI=1
          export RNFirebaseAsStaticFramework=true
          npx expo prebuild --platform ios --clean

      - name: Verify generated iOS project
        script: |
          ls -la ios
          test -d ios/AirMessDriver.xcworkspace
          xcodebuild -list \
            -workspace ios/AirMessDriver.xcworkspace

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS simulator app
        script: |
          WORKSPACE="ios/AirMessDriver.xcworkspace"
          SCHEME="AirMessDriver"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
