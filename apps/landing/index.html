    <title>AIRMESS — Vous vendez, nous livrons</title>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KVMJQF9J8Z"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        window.dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-KVMJQF9J8Z')

      document.addEventListener('click', function (event) {
        const anchor = event.target instanceof Element ? event.target.closest('a[href]') : null
        if (!anchor) return

        const url = anchor.getAttribute('href') || ''
        const send = function (name) {
          gtag('event', name, { link_url: url })
        }

        if (url.includes('/register/driver')) return send('click_register_driver')
        if (url.includes('/register')) return send('click_register_sender')
        if (url.includes('wa.me')) return send('click_whatsapp')
        if (url.includes('expo.dev')) return send('click_download_driver_app')
      })
    </script>

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
